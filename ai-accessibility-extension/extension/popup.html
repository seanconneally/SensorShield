<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Sensory Shield</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 270px;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-icon {
      font-size: 18px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge.active {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #10b981;
    }
    .badge.inactive {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      border: 1px solid #475569;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }
    .control-label {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .control-sublabel {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: 0.25s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.25s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #10b981;
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    .btn-scan {
      width: 100%;
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.1s ease;
      margin-bottom: 10px;
    }
    .btn-scan:hover {
      background: #fbbf24;
      transform: scale(1.01);
    }
    .btn-scan:active {
      transform: scale(0.99);
    }
    .footer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .kbd {
      background: #334155;
      color: #cbd5e1;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <span class="title-icon">🛡️</span>
      <span class="title">Sensory Shield</span>
    </div>
    <span id="status-badge" class="badge inactive">OFF</span>
  </div>

  <div class="control-row">
    <div>
      <div class="control-label">Video Protection</div>
      <div class="control-sublabel">Automatically monitors TikTok and Reels</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="shield-toggle" aria-label="Enable sensory protection">
      <span class="slider"></span>
    </label>
  </div>

  <button type="button" id="scan-btn" class="btn-scan">
    <span>⚡</span>
    <span>Rescan videos</span>
  </button>

  <p id="scan-status" role="status" style="font-size:12px;line-height:1.5"></p><p style="font-size:12px;line-height:1.5">Only TikTok and Instagram/Facebook Reel videos are monitored. Warnings cover the video only. Frame analysis stays on your device.</p>
  <div class="footer">
    <span>Local rescan:</span>
    <span class="kbd">Alt + V</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
